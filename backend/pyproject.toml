[project]
name = "trustlayer-backend"
version = "0.1.0"
description = "TrustLayer AI Backend Core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg",
    "alembic",
    "pydantic>=2.7.0",
    "pydantic-settings",
    "redis>=5.0.0",
    "argon2-cffi",
    "pyjwt",
    "jsonschema",
    "httpx",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true